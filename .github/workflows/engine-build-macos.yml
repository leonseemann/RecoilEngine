# Builds the macOS engine (engine + Mesa/Zink/KosmicKrisp,
# recoil_<version>_arm64-macos.7z) for Apple Silicon. Pull requests and pushes
# get an ad-hoc signed engine; release tags (<engine version>-mac.<n>, e.g.
# 2026.09.01-mac.1) are signed and notarized when the Developer ID secrets are
# set and publish the archive as a GitHub release.
#
# Secrets (all optional, without them or set to CHANGE_ME the engine is ad-hoc signed):
#   MACOS_CERT_P12         base64 of the exported "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD    password of that .p12
#   APPLE_ID               Apple ID used for notarization
#   APPLE_TEAM_ID          team id of the Developer ID certificate
#   APPLE_APP_PASSWORD     app-specific password of that Apple ID

name: Build Engine macOS
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - 'macos-port-*'
    paths-ignore:
      - '**.md'
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]-mac.*'

permissions:
  contents: write

jobs:
  build:
    if: github.repository != 'beyond-all-reason/RecoilEngine'
    runs-on: macos-26
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_P12 != 'CHANGE_ME' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_APP_PASSWORD != 'CHANGE_ME' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # lobbies compare the engine version, so the engine reports the
      # release it is based on instead of "<release>-<commits>-g<hash> <branch>"
      - name: Set the engine version
        run: |
          ENGINE_VERSION="$(git describe --tags --abbrev=0 --match '20[0-9][0-9].[0-9][0-9].[0-9][0-9]')"
          git tag -f "$ENGINE_VERSION" HEAD
          echo "ENGINE_VERSION=$ENGINE_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        id: deps
        run: |
          brew update
          # no jsoncpp: Homebrew builds it against libc++, so the engine uses its bundled copy;
          # spirv-tools and zstd are what the Mesa libraries link against
          brew install cmake ninja pkg-config gcc ccache sevenzip devil fontconfig freetype libvorbis minizip openal-soft sdl2-compat sdl3 vulkan-loader \
            spirv-tools zstd
          brew uninstall --ignore-dependencies jsoncpp 2>/dev/null || true
          # ccache needs fmt's library, but its headers would shadow the engine's own fmt
          brew unlink fmt
          echo "spirv-tools=$(brew list --versions spirv-tools | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # tag builds can only read caches of the default branch (macos-port-*),
      # pushes there and pull requests keep it warm
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build engine
        env:
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPRESS: 'true'
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          # GCC like the Linux and Windows builds, for the same floating point behaviour
          GCC_BIN="$(ls "$(brew --prefix gcc)"/bin/gcc-[0-9]* | sort -V | tail -n1)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER="$GCC_BIN" \
            -DCMAKE_CXX_COMPILER="${GCC_BIN/gcc-/g++-}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENAL_INCLUDE_DIR="$(brew --prefix openal-soft)/include/AL" \
            -DOPENAL_LIBRARY="$(brew --prefix openal-soft)/lib/libopenal.dylib" \
            -DAI_TYPES=NATIVE \
            -DBUILD_spring-dedicated=OFF \
            -DBUILD_spring-headless=OFF
          cmake --build build --target spring unitsync pr-downloader_cli basecontent C-AIInterface NullAI BARb
          ccache --show-stats

      - name: Save compiler cache
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}

      - name: Restore Mesa
        id: mesa
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mesa-prefix
          key: mesa-${{ hashFiles('installer/Mac/make-mesa.sh', 'installer/Mac/mesa-patches/**') }}-spirv-tools-${{ steps.deps.outputs.spirv-tools }}

      - name: Build Mesa (EGL + patched Zink + KosmicKrisp)
        if: steps.mesa.outputs.cache-hit != 'true'
        run: |
          brew install meson bison molten-vk llvm spirv-llvm-translator glslang
          installer/Mac/make-mesa.sh "$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa-prefix"

      - name: Import signing certificate
        if: env.IS_RELEASE == 'true' && env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application:[^"]*"' | head -n1 | tr -d '"')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Bundle engine
        run: MESA_PREFIX="$RUNNER_TEMP/mesa-prefix" installer/Mac/make-engine.sh build dist

      - name: Notarize
        if: env.IS_RELEASE == 'true' && env.HAS_NOTARY == 'true' && env.SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # the same signed files as in the 7z archive, which notarytool does not take
          xcrun notarytool submit dist/engine-notarize.zip --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-artifacts-arm64-macos
          path: dist/recoil_*.7z

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/recoil_*.7z \
            --title "$GITHUB_REF_NAME" \
            --notes "Recoil engine $ENGINE_VERSION for Apple Silicon Macs (macOS 26 or later)."
